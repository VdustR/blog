allowBuilds:
  core-js: true
  esbuild: true
overrides:
  # Astro's frontmatter helper still limits TOML to the vulnerable 1.8 series.
  "@astrojs/internal-helpers>smol-toml": 1.9.0
  # Keep the nesting plugin while using the parser's linear-time security fix.
  postcss-nested>postcss-selector-parser: 7.1.6
